random_state = 42
verbose = true
train = false      # train using default hyperparameters
tune = true      # tune hyperparameters
evaluate = true   # Generate performance metrics from the test set
train_size = 0.8
data_dir = "data/"

[dataloader]
batch_size = 32
num_workers = 0   # > 1 for multiprocessing
pin_memory = true
persistent_workers = false

[model]
vocab_size = 100
embedding_dim = 256
hidden_dim = 64
n_layers = 3
padding_idx = 0

[optimizer]
lr = 1e-5
momentum = 0.9
weight_decay = 1e-6

[trainer]
max_epochs = 10
gradient_clip = 1.0
eval_every_n_epochs = 1

[tuner]
n_trials = 4
prune = true
checkpoint = "data/checkpoint.pt" # TODO: dynamically append paths
hyperparameters = "data/hyperparameters.json" # TODO: dynamically append paths

[tuner.hidden_dim]
name = "hidden_dim"
low = 6 # 2^6 = 64
high = 9 # 2^9 = 512
[tuner.n_layers]
name = "n_layers"
low = 1
high = 6
[tuner.lr]
name = "lr"
low = 1e-5
high = 1e-3
log = true
[tuner.weight_decay]
name = "weight_decay"
low = 1e-10
high = 1e-2
log = true

[evaluator]
n_bootstraps = 1000


