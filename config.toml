seed = 42 # Random seed for reproducibility
dev_run = false # Run a small subset of the data for debugging
regenerate = false # Regenerate the tokenized dataset
tune = false      # tune hyperparameters
train = false      # train using the best hyperparameters
evaluate = true   # Generate performance metrics from the test set
feature_importance = false # Compute feature importance
data_dir = "data/"

[tokenizer]
path = "tokenizer"
vocab_size = 10_000
max_length = 512

[dataset]
name = "ag_news"
path = "ag_news/"
train_size = 0.8
stratify = "label"

[dataloader]
batch_size = 32
num_workers = 0   # > 1 for multiprocessing
pin_memory = true
persistent_workers = false

[model]
compile = false
embedding_dim = 256
hidden_dim = 64

[optimizer]
lr = 1e-5
momentum = 0.9
weight_decay = 1e-6

[trainer]
max_epochs = 4
gradient_clip = 1.0

[tuner]
n_trials = 2
direction = "minimize"
checkpoint = "checkpoint.pt"
hparams_path = "hyperparameters.json"

[hparams]
[hparams.max_epochs]
name = "max_epochs"
low = 1
high = 1 # FIXME increase to 10
[hparams.hidden_dim]
name = "hidden_dim"
low = 6 # 2^6 = 64
high = 9 # 2^9 = 512
[hparams.lr]
name = "lr"
low = 1e-5
high = 1e-3
log = true
[hparams.weight_decay]
name = "weight_decay"
low = 1e-10
high = 1e-2
log = true

[evaluator]
n_bootstraps = 0
aggregate = true

[importance]
num_samples = 200
plot_path = "importance.pdf"

[plots]
path = "plots/"
style = "darkgrid"
font_scale = 1.5
palette = "viridis"